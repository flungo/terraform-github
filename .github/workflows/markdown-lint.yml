# Caller for the reusable Markdown lint workflow in flungo/github-workflows.
# Rules live in .markdownlint-cli2.jsonc at the repo root. See that repo's
# docs/runbooks/adopting-markdown-workflows.md.
name: Markdown lint

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/markdown-lint.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/markdown-lint.yml'

jobs:
  markdown-lint:
    uses: flungo/github-workflows/.github/workflows/markdown-lint.yml@v2
